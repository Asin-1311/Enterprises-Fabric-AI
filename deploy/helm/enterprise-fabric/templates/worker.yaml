{{- if .Values.worker.enabled }}
{{- if ne .Values.profile "full" }}
{{- fail "the worker Deployment is for profile full (in lite the API consumes change events itself)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ef.name" . }}-worker
  labels:
    {{- include "ef.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: 1   # one consumer group member is enough for one partition (CLAUDE.md section 6)
  selector:
    matchLabels: {{- include "ef.selector" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ef.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.worker.metricsPort | quote }}
    spec:
      securityContext:
        {{- include "ef.podSecurity" . | nindent 8 }}
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: worker
          image: "{{ .Values.images.worker.repository }}:{{ .Values.images.worker.tag }}"
          imagePullPolicy: {{ .Values.images.worker.pullPolicy }}
          ports: [{name: metrics, containerPort: {{ .Values.worker.metricsPort }}}]
          {{- include "ef.pythonEnv" . | nindent 10 }}
          securityContext: {{- include "ef.containerSecurity" . | nindent 12 }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - {name: state, mountPath: /var/lib/fabric}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: state, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
{{- end }}
