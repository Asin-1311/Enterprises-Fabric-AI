apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ef.name" . }}-api
  labels:
    {{- include "ef.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  {{- if eq .Values.profile "lite" }}
  strategy: {type: Recreate}   # the embedded stores belong to one pod at a time
  {{- end }}
  selector:
    matchLabels: {{- include "ef.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ef.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.api.port | quote }}
        prometheus.io/path: /metrics
    spec:
      securityContext:
        {{- include "ef.podSecurity" . | nindent 8 }}
        runAsUser: 10001
        fsGroup: 10001
      {{- if eq .Values.profile "lite" }}
      initContainers:
        # Index the SYNTHETIC corpus into this pod's SQLite and Qdrant before the API starts.
        - name: index-corpus
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command: ["python", "-m", "app.ingest.indexer", "--actor", "helm-init"]
          {{- include "ef.pythonEnv" . | nindent 10 }}
          securityContext: {{- include "ef.containerSecurity" . | nindent 12 }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - {name: state, mountPath: /var/lib/fabric}
            - {name: tmp, mountPath: /tmp}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          ports: [{name: http, containerPort: {{ .Values.api.port }}}]
          {{- include "ef.pythonEnv" . | nindent 10 }}
          securityContext: {{- include "ef.containerSecurity" . | nindent 12 }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /api/v1/health, port: http}
            failureThreshold: {{ .Values.api.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.api.startupProbe.periodSeconds }}
          readinessProbe:
            httpGet: {path: /api/v1/health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/v1/health, port: http}
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - {name: state, mountPath: /var/lib/fabric}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: state
          emptyDir: {sizeLimit: {{ .Values.api.stateSize }}}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ef.name" . }}-api
  labels:
    {{- include "ef.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "ef.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports: [{name: http, port: {{ .Values.api.port }}, targetPort: http}]
{{- if .Values.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ef.name" . }}-api
  labels: {{- include "ef.labels" . | nindent 4 }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "ef.name" . }}-api}
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ .Values.hpa.targetCPUUtilizationPercentage }}}
{{- end }}
