{{- if not .Values.secrets.existingSecret }}
# Created only when no existing Secret is named: for a local demo (kind) where the values
# are given on the command line. A real deployment names an existing Secret instead, so no
# secret ever passes through a values file.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ef.name" . }}-secrets
  labels: {{- include "ef.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- if not .Values.secrets.values }}
  PLACEHOLDER: "none"
  {{- end }}
{{- end }}
