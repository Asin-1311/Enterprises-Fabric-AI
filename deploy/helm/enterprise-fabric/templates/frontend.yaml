{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ef.name" . }}-frontend
  labels:
    {{- include "ef.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "ef.selector" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ef.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        {{- include "ef.podSecurity" . | nindent 8 }}
        runAsUser: 101
      containers:
        - name: frontend
          image: "{{ .Values.images.frontend.repository }}:{{ .Values.images.frontend.tag }}"
          imagePullPolicy: {{ .Values.images.frontend.pullPolicy }}
          env:
            - name: API_UPSTREAM
              value: "http://{{ include "ef.name" . }}-api:{{ .Values.api.port }}"
          ports: [{name: http, containerPort: {{ .Values.frontend.port }}}]
          securityContext: {{- include "ef.containerSecurity" . | nindent 12 }}
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          volumeMounts:
            # nginx writes its rendered config, pid and temp files here (read-only root).
            - {name: conf, mountPath: /etc/nginx/conf.d}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: conf, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ef.name" . }}-frontend
  labels:
    {{- include "ef.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "ef.selector" (dict "root" . "component" "frontend") | nindent 4 }}
  ports: [{name: http, port: {{ .Values.frontend.port }}, targetPort: http}]
{{- end }}
