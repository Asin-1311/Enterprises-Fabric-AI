# `helm test <release>`: health, metrics, sign-in and one question against the API service
# (scripts/smoke_deploy.py). With llm.mode=mock it needs no key and makes no paid call.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "ef.name" . }}-smoke-test
  labels: {{- include "ef.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  securityContext:
    {{- include "ef.podSecurity" . | nindent 4 }}
    runAsUser: 10001
  containers:
    - name: smoke
      image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
      imagePullPolicy: {{ .Values.images.api.pullPolicy }}
      command: ["python", "-m", "scripts.smoke_deploy",
                "--base", "http://{{ include "ef.name" . }}-api:{{ .Values.api.port }}",
                "--email", {{ .Values.smokeTest.email | quote }}]
      env:
        - name: SMOKE_PASSWORD
          valueFrom:
            secretKeyRef: {name: {{ include "ef.secretName" . }}, key: DEMO_PASSWORD, optional: true}
      securityContext: {{- include "ef.containerSecurity" . | nindent 8 }}
      resources:
        requests: {cpu: 50m, memory: 128Mi}
        limits: {cpu: 500m, memory: 512Mi}
      volumeMounts:
        - {name: tmp, mountPath: /tmp}
  volumes:
    - {name: tmp, emptyDir: {}}
