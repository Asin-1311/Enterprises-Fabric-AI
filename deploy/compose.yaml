# Enterprise Fabric AI: the FULL profile's servers (CLAUDE.md sections 2 and 3).
#
# Start a group (from the project root; credentials come from .env, never from git):
#   docker compose --env-file .env -f deploy/compose.yaml --profile core up -d     # PostgreSQL, Qdrant, OpenSearch, Redis
#   docker compose --env-file .env -f deploy/compose.yaml --profile ingest up -d   # Kafka, MinIO
#   docker compose --env-file .env -f deploy/compose.yaml --profile identity up -d # OPA, Keycloak
#   docker compose --env-file .env -f deploy/compose.yaml --profile full up -d     # all of the above + Debezium
#   docker compose --env-file .env -f deploy/compose.yaml --profile observability up -d
#        # Prometheus, Grafana, Langfuse (+ ClickHouse; reuses PostgreSQL, Redis, MinIO).
#        # First run: python -m scripts.observability_setup. Too large to run beside
#        # `full` on the 3.5 GB Docker VM: stop `full` first (M17a).
# Stop:            docker compose --env-file .env -f deploy/compose.yaml --profile full down
# Stop and ERASE:  ... --profile full down -v   (deletes the volumes: all full-profile data)
#
# Sized for the development laptop (7.3 GB RAM; the Docker VM is capped at 3.5 GB in
# %USERPROFILE%\.wslconfig): small memory limits and Java heaps. Measured in M10: these five
# services together use about 1.4 GB, so `--profile full` fits. The services added later
# (identity, observability) will not all fit alongside them; start groups as needed.
# Ports are published on 127.0.0.1 only, so nothing is reachable from the network.

name: enterprise-fabric

services:
  postgres:
    image: postgres:16.6-alpine
    profiles: [core, full, observability]
    # Logical replication for Debezium change data capture from the synthetic DMS database
    # (M12d). It only adds information to the write-ahead log; the app is unaffected.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4",
              "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fabric}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fabric}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    deploy:
      resources:
        limits: {memory: 256m}

  qdrant:
    image: qdrant/qdrant:v1.20.0   # matches qdrant-client 1.20.0 in requirements.txt
    profiles: [core, full]
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrant-data:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      retries: 20
    deploy:
      resources:
        limits: {memory: 512m}

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    profiles: [core, full]
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "false"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      # Local development only: no TLS or login on 127.0.0.1. Declared as a deviation in
      # docs/report/COMPLIANCE.md; the Kubernetes deployment (M17) keeps security on.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ports: ["127.0.0.1:9200:9200"]
    volumes: [opensearch-data:/usr/share/opensearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 30
    deploy:
      resources:
        # 512 MB heap + the JVM's own memory: measured ~1 GB at idle on first start, so
        # 1 GB was too tight (M10). All five services together still fit in 3.5 GB.
        limits: {memory: 1280m}

  redis:
    image: redis:7.4.2-alpine
    profiles: [core, full, observability]
    command: ["redis-server", "--save", "", "--appendonly", "no"]  # a cache: no persistence
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    deploy:
      resources:
        limits: {memory: 128m}

  kafka:
    image: apache/kafka:3.9.0      # KRaft mode: no ZooKeeper
    profiles: [ingest, full]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      # 127.0.0.1, not "localhost": on Windows "localhost" tries IPv6 (::1) first, and the
      # published ports are IPv4 only, so every connection waited for a timeout (M10).
      # INTERNAL (M12d): the address other containers (Debezium) use on the Docker network.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092,INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports: ["127.0.0.1:9092:9092"]
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      retries: 30
    deploy:
      resources:
        limits: {memory: 768m}

  minio:
    # S3-compatible object store for the S3 connector (bucket "firm-documents", M12c).
    # MinIO no longer publishes its own server image (docker.io/minio/minio and
    # quay.io/minio/minio could not be pulled on 2026-11-19), so this is the MinIO server
    # packaged by Bitnami, from their frozen "legacy" repository: it gets no further
    # updates or security fixes (author's decision; noted in docs/report/COMPLIANCE.md).
    # Acceptable here: it listens on 127.0.0.1 only and holds synthetic documents.
    image: bitnamilegacy/minio:2025.7.23
    profiles: [ingest, full, observability]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_DEFAULT_BUCKETS: firm-documents
    ports: ["127.0.0.1:9000:9000"]   # S3 API only; the web console is not published
    volumes: [minio-data:/bitnami/minio/data]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 30
    deploy:
      resources:
        limits: {memory: 384m}

  debezium:
    # Kafka Connect with the Debezium PostgreSQL connector: streams every change to the
    # synthetic DMS table dms.documents to the Kafka topic "dms.dms.documents" (M12d).
    # The connector itself is registered by scripts/register_debezium_connector.py with
    # deploy/debezium/dms-connector.json. The database password reaches it through this
    # container's environment (Kafka's EnvVarConfigProvider), never through a file in git.
    image: quay.io/debezium/connect:3.1.2.Final
    profiles: [full]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: debezium-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      # Plain JSON messages (no embedded schema), which the dms connector reads.
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      DMS_DB_USER: ${POSTGRES_USER:-fabric}
      DMS_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      HEAP_OPTS: -Xms256m -Xmx512m
    ports: ["127.0.0.1:8083:8083"]   # Kafka Connect REST API (register/inspect the connector)
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connectors >/dev/null || exit 1"]
      interval: 10s
      retries: 30
    deploy:
      resources:
        limits: {memory: 768m}

  opa:
    # Open Policy Agent: decides per candidate chunk whether the user may see it, from
    # policy/document_access.rego (M13). The policy folder is mounted read-only; OPA
    # reloads it when the files change (--watch).
    image: openpolicyagent/opa:1.4.2
    profiles: [identity, full]
    command: ["run", "--server", "--addr", "0.0.0.0:8181", "--watch", "/policy/document_access.rego"]
    volumes: ["../policy:/policy:ro"]
    ports: ["127.0.0.1:8181:8181"]
    deploy:
      resources:
        limits: {memory: 128m}

  keycloak:
    # Identity provider: OIDC sign-in and JWTs for the API (M13b). Imports the SYNTHETIC
    # realm deploy/keycloak/realm.json on first start (no passwords in it; run
    # scripts/keycloak_setup.py). Development mode with its built-in H2 database: realm
    # data lives in the container, so `down` and `up` re-import the same realm. A
    # production deployment uses a real database and TLS (M17).
    image: quay.io/keycloak/keycloak:26.0.7
    profiles: [identity, full]
    command: ["start-dev", "--import-realm", "--http-port=8080", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      # Tokens name this issuer; the API checks it (OIDC_ISSUER).
      KC_HOSTNAME: http://127.0.0.1:8180
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=60
    volumes: ["./keycloak:/opt/keycloak/data/import:ro"]
    ports: ["127.0.0.1:8180:8080"]
    deploy:
      resources:
        limits: {memory: 768m}

  # --------------------------------------------------------------- observability (M17a)

  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    extra_hosts: ["host.docker.internal:host-gateway"]  # the API and worker run on the host
    ports: ["127.0.0.1:9090:9090"]
    deploy:
      resources:
        limits: {memory: 192m}

  grafana:
    image: grafana/grafana:13.0.13
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus]
    deploy:
      resources:
        limits: {memory: 256m}

  clickhouse:
    # Langfuse's event store.
    image: clickhouse/clickhouse-server:25.8.33.6
    profiles: [observability]
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    volumes: [clickhouse-data:/var/lib/clickhouse]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      retries: 30
    deploy:
      resources:
        limits: {memory: 896m}

  langfuse-worker:
    image: langfuse/langfuse-worker:3.225.15
    profiles: [observability]
    restart: unless-stopped   # waits out its database and bucket on a first start
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    environment: &langfuse-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-fabric}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT:-}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://redis:6379
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
    deploy:
      resources:
        limits: {memory: 512m}

  langfuse-web:
    image: langfuse/langfuse:3.225.15
    profiles: [observability]
    restart: unless-stopped
    depends_on: [langfuse-worker]
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-}
      AUTH_DISABLE_SIGNUP: "true"
      # A SYNTHETIC organisation and project, created on first start with the keys the API
      # sends traces with (LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY in .env).
      LANGFUSE_INIT_ORG_ID: example-associates
      LANGFUSE_INIT_ORG_NAME: Example & Associates (SYNTHETIC)
      LANGFUSE_INIT_PROJECT_ID: enterprise-fabric
      LANGFUSE_INIT_PROJECT_NAME: Enterprise Fabric AI
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: admin@example-associates.test
      LANGFUSE_INIT_USER_NAME: Langfuse admin (SYNTHETIC)
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD:-}
      # Node's default heap (sized from the container limit) is too small for start-up.
      NODE_OPTIONS: --max-old-space-size=1024
    ports: ["127.0.0.1:3000:3000"]
    deploy:
      resources:
        limits: {memory: 1280m}

volumes:
  prometheus-data:
  clickhouse-data:
  postgres-data:
  qdrant-data:
  opensearch-data:
  kafka-data:
  minio-data:
