# Prometheus for Enterprise Fabric AI (compose profile "observability"; M17a).
# Scrapes the API (/metrics) and the ingestion worker (port 9464). In docker compose the
# API and worker run on the host, reached as host.docker.internal; the Helm chart (M17b)
# configures the in-cluster targets instead.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9464"]
