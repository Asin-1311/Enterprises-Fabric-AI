# The Python environment every CI job uses (M17c): Python 3.13, CPU-only PyTorch (as on the
# laptop and in deploy/docker/app.Dockerfile), the pinned requirements, and the three models
# at their pinned revisions (deploy/docker/fetch_models.py), cached between runs.
name: Python environment
description: Python 3.13 with the project's pinned requirements and the cached CPU models
inputs:
  full:
    description: "also install requirements-full.txt (the full-profile adapters)"
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-full.txt
    - name: Install CPU PyTorch and the requirements
      shell: bash
      run: |
        python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
        python -m pip install -r requirements.txt
        if [ "${{ inputs.full }}" = "true" ]; then python -m pip install -r requirements-full.txt; fi
    - name: Cache the models
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/huggingface
        key: hf-models-${{ hashFiles('deploy/docker/fetch_models.py') }}
    - name: Fetch the models at their pinned revisions
      shell: bash
      run: python deploy/docker/fetch_models.py
