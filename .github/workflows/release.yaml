# Release and staging (M17c; CLAUDE.md section 14 "Promotion").
#
# Called by ci.yaml only after EVERY CI job has passed, on a push to phase2 or main:
# 1. publish: build the api, worker and frontend images and push them to GitHub Container
#    Registry, tagged with the commit SHA (and the branch name);
# 2. staging: create a kind cluster on the runner, load exactly those images, install the
#    Helm chart in the namespace `staging` (lite profile, LLM_MODE=mock, random demo
#    password) and run `helm test` (scripts/kind_smoke.py).
# Prompt and routing changes are gated twice before they reach users: CI's replay gates
# (eval/gates.py) and, in the running system, activation only with a passing replay report.

name: Release

on:
  workflow_call:

permissions:
  contents: read

env:
  HELM_VERSION: v4.3.2
  HELM_SHA256: d1c0278d46beab79582d7e50f5b3dc206944ba8e577cde618513fd07daa53983
  KIND_VERSION: v0.33.0
  KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d

jobs:
  publish:
    name: Publish images (tagged per commit)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      prefix: ${{ steps.names.outputs.prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - id: names
        name: Image names (registry paths must be lower case)
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/enterprise-fabric" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/app.Dockerfile
          target: api
          push: true
          tags: ${{ steps.names.outputs.prefix }}-api:${{ github.sha }},${{ steps.names.outputs.prefix }}-api:${{ github.ref_name }}
          cache-from: type=gha,scope=app
      - name: worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/app.Dockerfile
          target: worker
          push: true
          tags: ${{ steps.names.outputs.prefix }}-worker:${{ github.sha }},${{ steps.names.outputs.prefix }}-worker:${{ github.ref_name }}
          cache-from: type=gha,scope=app
      - name: frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/frontend.Dockerfile
          push: true
          tags: ${{ steps.names.outputs.prefix }}-frontend:${{ github.sha }},${{ steps.names.outputs.prefix }}-frontend:${{ github.ref_name }}
          cache-from: type=gha,scope=frontend

  staging:
    name: Deploy to staging (kind) and smoke test
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space (each image is held twice, by Docker and by the kind node)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the published images
        env:
          PREFIX: ${{ needs.publish.outputs.prefix }}
        run: |
          for name in api worker frontend; do
            docker pull "$PREFIX-$name:$GITHUB_SHA"
            docker tag "$PREFIX-$name:$GITHUB_SHA" "enterprise-fabric/$name:$GITHUB_SHA"
          done
      - name: Install kind and helm (pinned, checksums verified)
        run: |
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum -c -
          chmod +x kind && sudo mv kind /usr/local/bin/kind
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm && sudo mv linux-amd64/helm /usr/local/bin/helm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Helm install in namespace staging and helm test
        env:
          LLM_MODE: mock
          MODEL_LIGHT: ci-mock-light
          MODEL_SYNTH: ci-mock-synth
          MODEL_VERIFY: ci-mock-verify
          MODEL_JUDGE: ci-mock-judge
        run: |
          python -m pip install --quiet pydantic-settings==2.16.2
          python -m scripts.kind_smoke --namespace staging --tag "$GITHUB_SHA"
