# Alembic (schema migrations for the metadata store; full profile = PostgreSQL).
# The database URL comes from DATABASE_URL in .env (app/db/migrations/env.py).
#   .venv\Scripts\python.exe -m alembic upgrade head
#   .venv\Scripts\python.exe -m alembic revision -m "describe the change"

[alembic]
script_location = app/db/migrations
prepend_sys_path = .

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
