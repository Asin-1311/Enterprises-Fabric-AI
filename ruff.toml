# Python lint (M17c; CLAUDE.md section 14: "Python lint" in CI). Ruff is a CI-only tool,
# installed pinned in .github/workflows/ci.yaml, not part of requirements.txt.
# The rule set is ruff's default: syntax errors, the pycodestyle error checks that catch
# real mistakes, and pyflakes (undefined names, unused imports and variables).
target-version = "py313"
extend-exclude = ["data", "eval/results", "frontend", "models", ".venv*"]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# pytest fixtures imported from another test module are re-declared as test parameters.
"tests/**" = ["F811"]
